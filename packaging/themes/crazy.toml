# CRAZY — circus kaleidoscope; every configured colour has a unique RGB value.
# Select Settings → Theme → Custom: crazy. Changes reload automatically.
# Every supported colour key, widget state and button style is explicitly set.
# Specific settings win over broader ones: some defaults are intentionally shadowed.
# Device-specific blocks below match this machine; families cover other devices.
# This is a colour-coverage demo: even strokes, fills, glows and dots differ.
